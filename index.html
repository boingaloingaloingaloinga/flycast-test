<head>
  <script src="coi-serviceworker.min.js"></script>
  <title>Dreamcast Emulator Test</title>
</head>

<body>
  <div style="width:640px;height:480px">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'dreamcast'; 
    EJS_gameUrl = "https://dl.dropboxusercontent.com/scl/fi/199i3k4kgl35qeyvv9lmf/Sonic-Adventure.cdi?rlkey=02vwio6qhykxk4szwj703y1to&st=h4wt2s7a&dl=0";
    
    // Explicitly path the local flycast WASM files
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; 
    EJS_coreUrl = './cores/flycast_libretro.js'; 

    // Point EmulatorJS to your dumped BIOS files
    EJS_biosUrl = {
        'dc_boot.bin': './data/bios/dc_boot.bin',
        'dc_flash.bin': './data/bios/dc_flash.bin'
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
